<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><canvas id="gl"></canvas><canvas id="out"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const W=720,H=1280, gl=document.getElementById('gl'), out=document.getElementById('out'); gl.width=out.width=W; gl.height=out.height=H;
const ctx=out.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:gl,antialias:true,preserveDrawingBuffer:true}); renderer.setSize(W,H,false);
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x7fb2ee); scene.fog=new THREE.Fog(0x9cc2f0,25,90);
const cam=new THREE.PerspectiveCamera(50,W/H,0.1,300);
const rnd=(s)=>()=>{s|=0;s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};
const R=rnd(4);
scene.add(new THREE.HemisphereLight(0xbcd8ff,0x555560,1.2));
const sun=new THREE.DirectionalLight(0xfff1d8,3); sun.position.set(-12,20,14); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:80}); scene.add(sun);
const M=(c,r=0.6)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0.1});
// ground
const road=new THREE.Mesh(new THREE.PlaneGeometry(400,16),M(0x3d3f46,0.9)); road.rotation.x=-Math.PI/2; road.receiveShadow=true; scene.add(road);
const walk=new THREE.Mesh(new THREE.PlaneGeometry(400,12),M(0x9a9a9e,0.9)); walk.rotation.x=-Math.PI/2; walk.position.set(0,0.02,-14); walk.receiveShadow=true; scene.add(walk);
for(let i=-20;i<20;i++){const l=new THREE.Mesh(new THREE.PlaneGeometry(3,0.3),M(0xf2f2e6)); l.rotation.x=-Math.PI/2; l.position.set(i*8,0.03,0); scene.add(l);}
// buildings with window texture
function winTex(c1){const c=document.createElement('canvas');c.width=128;c.height=256;const x=c.getContext('2d');x.fillStyle=c1;x.fillRect(0,0,128,256);for(let y=8;y<250;y+=22)for(let xx=8;xx<120;xx+=26){x.fillStyle=R()<0.25?'#ffe9a8':'#2d3d58';x.fillRect(xx,y,16,13);}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const cols=['#8a8f99','#a89a8a','#6f7a8e','#9aa3ad'];
for(let i=-14;i<14;i++){const h=14+R()*34,w=7+R()*4;const t=winTex(cols[i&3]);t.repeat.set(1.4,h/9);const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,9),new THREE.MeshStandardMaterial({map:t,roughness:0.8}));b.position.set(i*9.5,h/2,-26);b.castShadow=true;scene.add(b);}
// mannequin
function mannequin(sweater,pants){const g=new THREE.Group();const sk=M(0xe6c9a8,0.7);const sw=M(sweater,0.8),pt=M(pants,0.8);
 const add=(geo,m,x,y,z,piv=g)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;piv.add(o);return o};
 add(new THREE.SphereGeometry(0.2,24,18),sk,0,1.72,0); add(new THREE.CapsuleGeometry(0.24,0.5,6,14),sw,0,1.2,0);
 const mk=(x,y,m,len,r)=>{const p=new THREE.Group();p.position.set(x,y,0);g.add(p);add(new THREE.CapsuleGeometry(r,len,6,10),m,0,-len/2-r*0.6,0,p);return p};
 g.userData={aL:mk(-0.34,1.4,sw,0.5,0.08),aR:mk(0.34,1.4,sw,0.5,0.08),lL:mk(-0.12,0.88,pt,0.6,0.1),lR:mk(0.12,0.88,pt,0.6,0.1)};
 const hands=0; return g;}
function car(color){const g=new THREE.Group();const add=(geo,m,x,y,z)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o};
 add(new RoundedBoxGeometry(4.2,0.8,1.9,4,0.25),M(color,0.35),0,0.7,0); add(new RoundedBoxGeometry(2.2,0.7,1.7,4,0.25),new THREE.MeshStandardMaterial({color:0x223348,roughness:0.15,metalness:0.4}),-0.2,1.3,0);
 for(const x of[-1.35,1.35])for(const z of[-0.95,0.95]){const w=add(new THREE.CylinderGeometry(0.38,0.38,0.3,20),M(0x16161a,0.8),x,0.38,z);w.rotation.x=Math.PI/2;}
 return g;}
// flying objects (all go east = +x, with different speeds & tumbles)
const objs=[];
const place=(obj,o)=>{obj.userData.f=o;scene.add(obj);objs.push(obj)};
const people=[mannequin(0xe8707a,0xd8c8a8),mannequin(0x5fbf6f,0x3a4a6a),mannequin(0x4a7fd8,0x2e2e38)];
people.forEach((p,i)=>place(p,{x0:-6+i*3.2,y0:2.5+i*1.4,z0:2-i*1.6,vx:11+i*2,vy:1.2,tum:[2.2+i,1.1,3.0-i*0.7],ph:i*1.7,kind:'p'}));
[[0xe8c33c,-14,6,-1],[0xb9d3ee,2,4,3],[0xd8d8de,-8,8,-4]].forEach(([c,x,y,z],i)=>place(car(c),{x0:x,y0:y,z0:z,vx:9+i*2.5,vy:0.6,tum:[0.8+i*0.4,1.5,1.3],ph:i,kind:'c'}));
const sub=3, win=0.035;
window.loadScene=(s)=>{window.S=s;window.ready=true;};
const camAt=(t)=>{ // low chase camera moving east, slowly rolling
 const x=t*9-2; cam.position.set(x-9+Math.sin(t*1.3)*2,3.2+Math.sin(t*0.9)*0.8,15-Math.min(t,3)*1.3); cam.lookAt(x+4,4.5+Math.sin(t*1.7),0); cam.rotateZ(Math.sin(t*1.1)*0.12);};
function setObjs(t){objs.forEach(o=>{const f=o.userData.f;const lt=Math.max(0,t);o.position.set(f.x0+f.vx*lt,f.y0+f.vy*lt-0.25*lt*lt*0.8+Math.sin(lt*3+f.ph)*0.6,f.z0);
 o.rotation.set(lt*f.tum[0],lt*f.tum[1]*0.6,lt*f.tum[2]*0.5);
 if(f.kind==='p'){const u=o.userData,a=Math.sin(lt*9+f.ph)*1.1;u.aL.rotation.z=-2.4+a;u.aR.rotation.z=2.4-a;u.lL.rotation.x=a;u.lR.rotation.x=-a;}});}
function drawCompass(t){const k=Math.min(1,Math.max(0,(t-0.3)/0.3)); if(!k)return;ctx.save();ctx.translate(W*0.5,H*0.2);ctx.scale(k,k);ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,70,0,7);ctx.stroke();ctx.fillStyle='#fff';
 for(let i=0;i<8;i++){ctx.save();ctx.rotate(i*Math.PI/4);const L=i%2?32:56;ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(0,-L);ctx.lineTo(9,0);ctx.closePath();ctx.fill();ctx.restore();}
 ctx.fillStyle='#5cf0a0';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(62,0);ctx.lineTo(0,8);ctx.closePath();ctx.fill();
 ctx.fillStyle='#fff';ctx.font='700 26px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('N',0,-92);ctx.fillText('S',0,92);ctx.fillText('W',-98,0);ctx.fillText('E',98,0);ctx.restore();}
window.renderFrame=(t)=>{
 ctx.clearRect(0,0,W,H);
 for(let i=0;i<sub;i++){const tt=t-i*win/sub*3; setObjs(tt); camAt(tt); renderer.render(scene,cam); ctx.globalAlpha=i===0?1:1/(i+1); ctx.drawImage(gl,0,0);}
 ctx.globalAlpha=1; drawCompass(t);
 for(const c of S.captions){if(t<c.t0||t>c.t1)continue;ctx.save();ctx.font='700 62px "DejaVu Sans",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;ctx.lineWidth=10;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.fillStyle='#fff';ctx.strokeText(c.text,W/2-30,H*0.76);ctx.fillText(c.text,W/2-30,H*0.76);ctx.restore();}
};
window.loaded=true;
</script></body></html>
