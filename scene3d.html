<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<canvas id="gl"></canvas><canvas id="out"></canvas>
<script type="module">
import * as THREE from 'three';
import * as F from '/factory3d.js';

const W = 720, H = 1280;
const gl = document.getElementById('gl'), out = document.getElementById('out');
gl.width = out.width = W; gl.height = out.height = H;
const ctx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 400);
let S = null, actors = [], stars, neb, lights = {};

const V = (a) => new THREE.Vector3(a[0], a[1], a[2]);
const interp = (kfs, t, key) => { // keyframed vectors with smooth easing
  if (t <= kfs[0].t) return kfs[0][key];
  for (let i = 0; i < kfs.length - 1; i++) {
    const a = kfs[i], b = kfs[i + 1];
    if (t <= b.t) { const k = F.smooth((t - a.t) / (b.t - a.t || 1)); const A = a[key], B = b[key]; return Array.isArray(A) ? A.map((v, j) => F.lerp(v, B[j], k)) : F.lerp(A, B, k); }
  }
  return kfs[kfs.length - 1][key];
};

window.loadScene = (json) => {
  S = json; scene.clear(); actors = [];
  const pal = F.PAL[S.bg || 'purple'];
  const bgTex = F.gradientTex([[0, pal.top], [0.5, pal.mid], [1, pal.bot]]);
  const bg = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ map: bgTex, depthWrite: false }));
  bg.position.z = -150; scene.add(bg);
  stars = F.makeStars(); scene.add(stars); neb = F.makeNebulae(pal.neb); scene.add(neb);
  scene.add(new THREE.HemisphereLight(pal.amb, 0x20104a, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(-5, 6, 9); scene.add(key); lights.key = key;
  const rim = new THREE.DirectionalLight(pal.rim, 2.2); rim.position.set(6, 2, -6); scene.add(rim);
  for (const a of S.actors) {
    const obj = a.kind === 'astronaut' ? F.makeAstro() : F.makePlanet(a.kind);
    obj.visible = false; scene.add(obj); actors.push({ cfg: a, obj });
  }
  window.ready = true;
};

const EXPRS = (n) => F.exprParams(n);
function exprAt(a, t) {
  const seq = a.expr || [[0, 'shock']];
  let i = 0; while (i + 1 < seq.length && t >= seq[i + 1][0]) i++;
  const cur = seq[i][1], prev = i ? seq[i - 1][1] : cur, k = i ? F.smooth((t - seq[i][0]) / 0.18) : 1;
  return [EXPRS(prev), EXPRS(cur), k];
}

function updateActor({ cfg, obj }, t) {
  const t0 = cfg.at ?? 0, t1 = cfg.until ?? 1e9;
  if (t < t0 || t > t1 + 0.6) { obj.visible = false; return; }
  obj.visible = true;
  const lt = t - t0, base = cfg.scale ?? 1;
  let s = base, pos = new THREE.Vector3(...cfg.pos), rot = new THREE.Euler(0, 0, 0), vis = true;
  // enter
  const ed = 0.55;
  if (lt < ed) {
    const k = lt / ed, en = cfg.enter || 'pop';
    if (en === 'pop') s = base * F.easeOutBack(k, 2.2);
    else if (en === 'fly') { const o = F.easeOutCubic(k); pos.add(new THREE.Vector3(...(cfg.from || [0, 0, 30])).multiplyScalar(1 - o)); s = base; }
    else if (en === 'drop') { pos.y += 9 * (1 - F.easeOutCubic(k)); pos.y += Math.abs(Math.sin(k * 9)) * (1 - k) * 0.8; }
    else if (en === 'zoom') { const o = F.easeOutCubic(k); pos.z += 5 * (1 - o); s = base * (0.3 + 0.7 * o); }
  }
  // exit
  if (t > t1) {
    const k = (t - t1) / 0.5, ex = cfg.exit || 'poof';
    if (ex === 'poof') { s = base * (1 + 0.25 * k) * (1 - F.easeInCubic(k)); }
    else if (ex === 'fly') { pos.x += 14 * F.easeInCubic(k); s = base; }
    else if (ex === 'shrink') { s = base * (1 - F.easeInCubic(k)); }
  }
  // idle motion
  const mo = cfg.motion || 'float', ph = cfg.phase || 0, sp = cfg.speed || 1;
  if (mo === 'float' || mo === 'spin') { pos.y += Math.sin(t * 1.6 * sp + ph) * 0.18; pos.x += Math.cos(t * 1.1 * sp + ph) * 0.1; }
  if (mo === 'orbit') { const r = cfg.radius || 2.5, a = t * 0.9 * sp + ph; pos.x += Math.cos(a) * r; pos.z += Math.sin(a) * r * 0.9; pos.y += Math.sin(a * 0.7) * 0.4; }
  if (mo === 'tumble') { pos.y += Math.sin(t * 2 * sp + ph) * 0.3; }
  if (mo === 'bounce') { pos.y += Math.abs(Math.sin(t * 3.2 * sp + ph)) * 0.7; }
  if (cfg.drift) pos.add(new THREE.Vector3(...cfg.drift).multiplyScalar(lt));
  if (cfg.moves) { // keyframed position: [{t, pos}] in local time
    pos.set(...interp(cfg.moves.map(m => ({ t: m.t, p: m.pos })), t, 'p'));
  }
  // rotation
  const isPlanet = obj.userData.kind !== 'astronaut';
  if (isPlanet) {
    obj.userData.spin.rotation.y = t * (cfg.spin ?? 0.5);
    obj.rotation.set(0.12 + Math.sin(t * 0.8 + ph) * 0.05, 0, Math.sin(t * 1.3 + ph) * 0.05);
    // face turns toward camera (face is child of root, spin is separate) -> look-at nudge
    obj.userData.face.rotation.set(0, Math.sin(t * 0.9 + ph) * 0.12, 0);
  } else {
    obj.rotation.set(0.05, Math.sin(t * 0.7 + ph) * 0.35 + (cfg.yaw || 0), Math.sin(t * 1.4 + ph) * 0.1);
    if (cfg.tumble) obj.rotation.z += t * cfg.tumble;
    F.poseAstro(obj, cfg.pose || 'float', t);
  }
  if (cfg.shake && lt < cfg.shake) { const a = (1 - lt / cfg.shake) * 0.25; pos.x += (Math.random() - 0.5) * a; pos.y += (Math.random() - 0.5) * a; }
  obj.position.copy(pos); obj.scale.setScalar(Math.max(0.0001, s));
  const [A, B, k] = exprAt(cfg, lt); obj.userData.setExpr(A, B, k);
}

function drawCaptions(t) {
  for (const c of S.captions || []) {
    if (t < c.t0 || t > c.t1) continue;
    const lt = t - c.t0, k = F.easeOutBack(lt / 0.22, 2.4), sc = 0.6 + 0.4 * k;
    const size = (c.size || 92) * (W / 1080) * 0.9;
    const style = c.style || 'white';
    const col = { white: '#fff', cyan: '#5ff0ff', yellow: '#ffe14a', red: '#ff5a5a' }[style] || '#fff';
    ctx.save(); ctx.translate(W / 2 - 20, (c.y ?? 0.2) * H); ctx.scale(sc, sc);
    ctx.font = `900 ${size}px "Arial Black", "DejaVu Sans", Impact, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.globalAlpha = F.clamp(lt / 0.08);
    const lines = c.text.split('\n'); const lh = size * 1.08;
    lines.forEach((ln, i) => {
      const y = (i - (lines.length - 1) / 2) * lh;
      ctx.lineWidth = size * 0.3; ctx.strokeStyle = '#140a38'; ctx.strokeText(ln, 0, y + size * 0.06);
      ctx.lineWidth = size * 0.3; ctx.strokeStyle = '#140a38'; ctx.strokeText(ln, 0, y);
      ctx.fillStyle = col; ctx.fillText(ln, 0, y);
    });
    ctx.restore();
  }
}

window.renderFrame = (t) => {
  // camera
  const kf = S.camera;
  const p = interp(kf, t, 'pos'), l = interp(kf, t, 'look'), f = interp(kf, t, 'fov');
  const roll = ('roll' in kf[0]) ? interp(kf, t, 'roll') : 0;
  cam.position.set(...p); cam.fov = f; cam.updateProjectionMatrix(); cam.lookAt(...l); cam.rotateZ(roll || 0);
  let shake = 0, flash = 0, dim = 0;
  for (const fx of S.fx || []) {
    const d = t - fx.t;
    if (fx.type === 'shake' && d >= 0 && d < fx.d) shake = Math.max(shake, (1 - d / fx.d) * (fx.a || 0.25));
    if (fx.type === 'flash' && d >= 0 && d < 0.25) flash = Math.max(flash, 1 - d / 0.25);
    if (fx.type === 'punch' && d >= 0 && d < 0.3) cam.fov -= Math.sin(d / 0.3 * Math.PI) * (fx.a || 6);
    if (fx.type === 'dim') dim = F.lerp(0, fx.a || 0.4, F.smooth((t - fx.t) / 0.5));
  }
  cam.updateProjectionMatrix();
  if (shake) cam.position.add(new THREE.Vector3((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, 0));
  stars.position.set(-p[0] * 0.05, -p[1] * 0.05, 0); stars.rotation.z = t * 0.004;
  neb.children.forEach((m) => { m.material.opacity = 0.42 + 0.1 * Math.sin(t * 0.8 + m.userData.ph); });
  lights.key.intensity = 2.6 * (1 - dim * 0.6);
  for (const a of actors) updateActor(a, t);
  renderer.render(scene, cam);
  ctx.drawImage(gl, 0, 0);
  if (dim) { ctx.fillStyle = `rgba(5,3,20,${dim * 0.5})`; ctx.fillRect(0, 0, W, H); }
  drawCaptions(t);
  if (flash) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.85})`; ctx.fillRect(0, 0, W, H); }
};
window.loaded = true;
</script></body></html>
